<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16202b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Finanze" />
<title>Finanze Famiglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
:root{
  --ink:#16202b; --ink-2:#22313f; --soft:#5b6a78; --faint:#8b98a4;
  --paper:#f2f4f1; --surface:#fff; --line:#e2e6e0; --line-2:#cbd2ca;
  --green:#2c6b4f; --green-bg:#e7f1ea;
  --red:#a83a32; --red-bg:#f9eae9;
  --amber:#a8721c; --amber-bg:#fbf1dd;
  --accent:#1f4d63;
  --nav-h:64px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--accent)}

/* ── struttura ── */
.shell{min-height:100vh;min-height:100dvh}
.appbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.appbar h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
.appbar .who{font-size:13px;color:#9fb0bd;margin-top:1px}
.appbar .act{background:rgba(255,255,255,.15);border:0;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
.main{padding:16px 14px calc(var(--nav-h) + 28px + var(--sab))}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--sab);
}
.tabbar button{
  background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--faint);font-size:11.5px;font-weight:600;cursor:pointer;min-height:var(--nav-h);justify-content:center;
}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.on{color:var(--ink)}

.side{display:none}

@media(min-width:760px){
  .shell{display:flex}
  .side{
    display:flex;flex-direction:column;gap:2px;width:230px;flex:0 0 230px;background:var(--ink);color:#dbe3e9;
    padding:22px 12px;position:sticky;top:0;height:100vh;overflow:auto;
  }
  .side .brand{padding:0 10px 20px}
  .side .brand b{display:block;font-size:18px;font-weight:600}
  .side .brand span{font-size:13px;color:#8ea0ad}
  .navlink{display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px;border-radius:9px;
    color:#c3cfd8;cursor:pointer;text-align:left;width:100%;font-size:15px}
  .navlink:hover{background:rgba(255,255,255,.08);color:#fff}
  .navlink.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
  .navlink .ic{width:20px;text-align:center}
  .navsep{margin:16px 10px 6px;font-size:12px;color:#7d8f9c}
  .side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
  .appbar{display:none}
  .tabbar{display:none}
  .main{flex:1;min-width:0;padding:26px 30px 60px}
}

/* ── testi ── */
.h1{font-size:24px;font-weight:600;margin:0 0 3px}
.sub{color:var(--soft);margin:0 0 18px;font-size:14.5px}
.h2{font-size:17px;font-weight:600;margin:0}
.small{font-size:13.5px}
.muted{color:var(--soft)}
.in-c{color:var(--green)} .out-c{color:var(--red)} .warn-c{color:var(--amber)}

/* ── card ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card + .card{margin-top:12px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
@media(min-width:760px){.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.kpi .lab{font-size:13px;color:var(--soft);line-height:1.25}
.kpi .val{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .hint{font-size:12.5px;color:var(--faint);margin-top:1px}

/* ── bottoni ── */
.btn{background:var(--ink);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:600;font-size:15.5px;cursor:pointer;min-height:46px}
.btn:active{background:var(--ink-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:active{background:#eef0ec}
.btn.sm{padding:8px 13px;min-height:38px;font-size:14px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + var(--sab));z-index:45;
  width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;border:0;
  font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(22,32,43,.32);cursor:pointer
}
@media(min-width:760px){.fab{display:none}}

/* ── form ── */
.f{display:block;font-size:13px;color:var(--soft);margin-bottom:5px;font-weight:500}
.inp{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:11px;background:#fff;color:var(--ink);min-height:48px}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235b6a78' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field{margin-bottom:13px}
.inp.big{font-size:26px;font-weight:600;padding:12px 13px;text-align:right;min-height:58px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;padding:6px 0}
.check input{width:20px;height:20px;margin:2px 0 0}
.segment{display:flex;background:#eceee9;border-radius:11px;padding:3px;gap:3px}
.segment button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-weight:600;font-size:15px;color:var(--soft);cursor:pointer}
.segment button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.segment button.on.out{color:var(--red)} .segment button.on.in{color:var(--green)}

/* ── liste (mobile) ── */
.list{display:flex;flex-direction:column}
.item{
  display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  padding:13px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;
  width:100%;text-align:left;cursor:pointer
}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;font-size:15.5px;line-height:1.3}
.item .s{font-size:13px;color:var(--soft);margin-top:2px}
.item .amt{font-weight:700;font-size:16px;white-space:nowrap;text-align:right}
.item .amt small{display:block;font-weight:500;font-size:12px;color:var(--faint)}

/* ── tabelle (desktop) ── */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--soft);padding:8px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.ta-r{text-align:right}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;background:#eff1ed;color:var(--soft);white-space:nowrap;font-weight:600}
.pill.in{color:var(--green);background:var(--green-bg)}
.pill.out{color:var(--red);background:var(--red-bg)}
.pill.warn{color:var(--amber);background:var(--amber-bg)}

.empty{padding:30px 12px;text-align:center;color:var(--soft);font-size:14.5px}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.bar{height:8px;background:#e8eae6;border-radius:5px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}

/* ── sheet / modale ── */
.sheet-bg{position:fixed;inset:0;background:rgba(15,22,29,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-height:94dvh;display:flex;flex-direction:column;
  border-radius:20px 20px 0 0;animation:up .22s ease-out
}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:17.5px;font-weight:600}
.sheet-body{padding:16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(14px + var(--sab));border-top:1px solid var(--line);display:flex;gap:9px;background:#fff}
.sheet-foot .btn{flex:1}
.x{background:#eff1ed;border:0;border-radius:9px;width:38px;height:38px;font-size:17px;cursor:pointer;color:var(--soft)}
@media(min-width:760px){
  .sheet-bg{align-items:flex-start;padding:34px 16px;overflow:auto}
  .sheet{max-width:620px;border-radius:16px;max-height:none}
  .sheet.wide{max-width:940px}
}

/* ── login ── */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;background:var(--ink)}
.login{background:#fff;border-radius:18px;padding:26px 22px calc(26px + var(--sab));width:100%;max-width:380px}
.login h1{font-size:22px;margin:0 0 3px;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + var(--sab));
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;z-index:200;font-size:14.5px;font-weight:500}
@media(min-width:760px){.toast{bottom:22px}}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useRef, useCallback} = React;

/* ─────────── Firebase ─────────── */
const firebaseConfig = {
  apiKey: "AIzaSyBDKokW_yIRycBGQHOONhgAXBpP1HU6p7k",
  authDomain: "finanze-famiglia-22175.firebaseapp.com",
  databaseURL: "https://finanze-famiglia-22175-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "finanze-famiglia-22175",
  storageBucket: "finanze-famiglia-22175.firebasestorage.app",
  messagingSenderId: "182817527147",
  appId: "1:182817527147:web:8775e603ab7a8efa74682e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT = "finanze";
const ref = (p) => db.ref(ROOT + "/" + p);

/* ─────────── utils ─────────── */
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MESI_B = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => new Date().toISOString().slice(0, 10);

function eur(n, seg) {
  const v = Number(n) || 0;
  const s = v.toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return (seg && v > 0 ? "+" : "") + s + " €";
}
function eurK(n) {
  const v = Math.round(Number(n) || 0);
  return v.toLocaleString("it-IT") + " €";
}
function dmy(iso) {
  if (!iso) return "";
  const p = String(iso).slice(0, 10).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
}
function dBreve(iso) {
  if (!iso) return "";
  const p = String(iso).slice(0, 10).split("-");
  return p.length === 3 ? Number(p[2]) + " " + MESI_B[Number(p[1]) - 1] : iso;
}
const mKey = (iso) => String(iso || "").slice(0, 7);
function mLabel(key) { const [y, m] = key.split("-"); return MESI[Number(m) - 1] + " " + y; }
function mLabelB(key) { const [y, m] = key.split("-"); return MESI_B[Number(m) - 1] + " " + y.slice(2); }
function addMonths(key, n) {
  let [y, m] = key.split("-").map(Number);
  m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return y + "-" + String(m).padStart(2, "0");
}
function daysInMonth(key) { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function dateInMonth(key, day) {
  const d = Math.min(Number(day) || 1, daysInMonth(key));
  return key + "-" + String(d).padStart(2, "0");
}
function num(v) {
  if (typeof v === "number") return v;
  if (v == null) return 0;
  const s = String(v).replace(/[€\s]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}
const obj2arr = (o) => o ? Object.keys(o).map(k => ({id: k, ...o[k]})) : [];
const byName = (a, b) => String(a.nome || "").localeCompare(String(b.nome || ""), "it");
function download(name, blob) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
}
function excelDate(v) {
  if (v == null || v === "") return "";
  if (v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === "number") return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (m) return m[1] + "-" + m[2].padStart(2, "0") + "-" + m[3].padStart(2, "0");
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (m) return (m[3].length === 2 ? "20" + m[3] : m[3]) + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  return "";
}

/* ─────────── hook ─────────── */
function useNode(path) {
  const [val, setVal] = useState(undefined);
  useEffect(() => {
    const r = ref(path);
    const cb = r.on("value", s => setVal(s.val()),
      err => { console.error("Lettura " + path + ":", err.message); setVal(null); });
    return () => r.off("value", cb);
  }, [path]);
  return val;
}
function useMobile() {
  const [m, setM] = useState(typeof window !== "undefined" && window.innerWidth < 760);
  useEffect(() => {
    const f = () => setM(window.innerWidth < 760);
    window.addEventListener("resize", f);
    return () => window.removeEventListener("resize", f);
  }, []);
  return m;
}

/* ─────────── UI base ─────────── */
function Field({label, children}) {
  return <div className="field"><label className="f">{label}</label>{children}</div>;
}
function Sheet({title, onClose, children, footer, wide}) {
  useEffect(() => {
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = ""; };
  }, []);
  return (
    <div className="sheet-bg" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={"sheet" + (wide ? " wide" : "")}>
        <div className="sheet-head"><b>{title}</b><button className="x" onClick={onClose}>✕</button></div>
        <div className="sheet-body">{children}</div>
        {footer && <div className="sheet-foot">{footer}</div>}
      </div>
    </div>
  );
}
const Empty = ({children}) => <div className="empty">{children}</div>;

function Riga({titolo, sotto, importo, sottoImporto, colore, onClick}) {
  const El = onClick ? "button" : "div";
  return (
    <El className="item" onClick={onClick}>
      <span style={{minWidth: 0}}>
        <span className="t" style={{display: "block"}}>{titolo}</span>
        {sotto && <span className="s" style={{display: "block"}}>{sotto}</span>}
      </span>
      {importo != null && <span className={"amt num " + (colore || "")}>{importo}
        {sottoImporto && <small>{sottoImporto}</small>}</span>}
    </El>
  );
}

/* ─────────── LOGIN ─────────── */
function Login({utenti, onLogin}) {
  const [u, setU] = useState(""); const [p, setP] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  async function submit(e) {
    e.preventDefault(); setErr(""); setBusy(true);
    try {
      const h = await sha256(p);
      const f = obj2arr(utenti).find(x =>
        String(x.username || "").toLowerCase() === u.trim().toLowerCase() && x.passwordHash === h);
      if (!f) { setErr("Nome utente o password non corretti."); setBusy(false); return; }
      onLogin(f);
    } catch (ex) { setErr("Accesso non riuscito: " + ex.message); setBusy(false); }
  }
  return (
    <div className="login-wrap">
      <form className="login" onSubmit={submit}>
        <h1>Finanze Famiglia</h1>
        <p className="sub">Entra con il tuo nome utente.</p>
        <Field label="Nome utente">
          <input className="inp" value={u} onChange={e => setU(e.target.value)}
            autoCapitalize="none" autoCorrect="off" autoComplete="username" /></Field>
        <Field label="Password">
          <input className="inp" type="password" value={p} onChange={e => setP(e.target.value)}
            autoComplete="current-password" /></Field>
        {err && <p className="small out-c" style={{margin: "0 0 12px"}}>{err}</p>}
        <button className="btn wide">{busy ? "Verifica…" : "Entra"}</button>
      </form>
    </div>
  );
}

/* ─────────── DASHBOARD ─────────── */
function Dashboard({data, saldi, prev, go, mobile}) {
  const {movimenti, scadenze, conti, categorie} = data;
  const oggi = todayISO(), mese = mKey(oggi);
  const delMese = movimenti.filter(m => mKey(m.data) === mese);
  const entrate = delMese.filter(m => m.tipo === "Entrata").reduce((s, m) => s + num(m.importo), 0);
  const uscite = delMese.filter(m => m.tipo === "Uscita").reduce((s, m) => s + num(m.importo), 0);
  const prossime = scadenze.filter(s => !s.pagata).sort((a, b) => String(a.dataScadenza).localeCompare(String(b.dataScadenza))).slice(0, 5);
  const liquidita = conti.filter(c => c.tipo !== "carta").reduce((s, c) => s + (saldi[c.id] || 0), 0);
  const carte = conti.filter(c => c.tipo === "carta").reduce((s, c) => s + Math.abs(saldi[c.id] || 0), 0);
  const primoRosso = prev.righe.find(r => r.saldoFine < prev.soglia);

  const topCat = useMemo(() => {
    const map = {};
    delMese.filter(m => m.tipo === "Uscita").forEach(m => {
      const c = categorie.find(x => x.id === m.categoriaId);
      const k = c ? c.nome : "Senza categoria";
      map[k] = (map[k] || 0) + num(m.importo);
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [movimenti, categorie]);
  const maxCat = topCat.length ? topCat[0][1] : 1;

  return (
    <div>
      {!mobile && <><h1 className="h1">Dashboard</h1>
        <p className="sub">{mLabel(mese)} · aggiornato al {dmy(oggi)}</p></>}

      <div className="grid g2" style={{marginBottom: 12}}>
        <div className="kpi">
          <div className="lab">Sui conti</div>
          <div className="val num">{eurK(liquidita)}</div>
          <div className="hint">{conti.filter(c => c.tipo !== "carta").length} conti correnti</div>
        </div>
        <div className="kpi">
          <div className="lab">Carte da addebitare</div>
          <div className="val num out-c">{eurK(carte)}</div>
          <div className="hint">non ancora sul conto</div>
        </div>
        <div className="kpi">
          <div className="lab">Entrate del mese</div>
          <div className="val num in-c">{eurK(entrate)}</div>
        </div>
        <div className="kpi">
          <div className="lab">Uscite del mese</div>
          <div className="val num out-c">{eurK(uscite)}</div>
          <div className="hint">saldo {eurK(entrate - uscite)}</div>
        </div>
      </div>

      {primoRosso &&
        <button className="card" style={{background: "var(--amber-bg)", borderColor: "#eddcbb", width: "100%", textAlign: "left", cursor: "pointer"}}
          onClick={() => go("previsioni")}>
          <b>Occhio alla giacenza.</b> A fine {mLabel(primoRosso.mese)} il saldo previsto è {eur(primoRosso.saldoFine)},
          sotto la soglia di {eur(prev.soglia)}. <span className="warn-c" style={{fontWeight: 600}}>Vedi la previsione</span>
        </button>}

      <div className="card">
        <div className="cardhead"><span className="h2">Prossime scadenze</span>
          <button className="btn ghost sm" onClick={() => go("scadenze")}>Tutte</button></div>
        {prossime.length === 0 ? <Empty>Nessuna scadenza da pagare.</Empty> :
          <div className="list">{prossime.map(s => (
            <Riga key={s.id} titolo={s.descrizione}
              sotto={dBreve(s.dataScadenza) + " · " + ((s.ambito || "famiglia") === "appartamento" ? "Appartamento" : "Famiglia")}
              importo={eur(s.importo)}
              colore={s.dataScadenza < oggi ? "out-c" : ""} />
          ))}</div>}
      </div>

      <div className="card">
        <div className="cardhead"><span className="h2">Uscite di {MESI[Number(mese.slice(5)) - 1]}</span>
          <button className="btn ghost sm" onClick={() => go("movimenti")}>Movimenti</button></div>
        {topCat.length === 0 ? <Empty>Nessuna uscita registrata questo mese.</Empty> :
          topCat.map(([nome, tot]) => (
            <div key={nome} style={{marginBottom: 11}}>
              <div style={{display: "flex", justifyContent: "space-between", fontSize: 14.5, marginBottom: 4}}>
                <span>{nome}</span><span className="num" style={{fontWeight: 600}}>{eur(tot)}</span></div>
              <div className="bar"><i style={{width: (tot / maxCat * 100) + "%"}} /></div>
            </div>))}
      </div>

      <div className="card">
        <div className="cardhead"><span className="h2">Conti e carte</span>
          <button className="btn ghost sm" onClick={() => go("anagrafiche")}>Gestisci</button></div>
        {conti.length === 0 ? <Empty>Aggiungi i conti e le carte per iniziare.</Empty> :
          <div className="list">{conti.map(c => (
            <Riga key={c.id} titolo={c.nome} sotto={c.tipo === "carta" ? "Carta di credito" : "Conto corrente"}
              importo={eur(saldi[c.id] || 0)} colore={(saldi[c.id] || 0) < 0 ? "out-c" : ""} />
          ))}</div>}
      </div>
    </div>
  );
}

/* ─────────── MOVIMENTI ─────────── */
const VUOTO_MOV = () => ({data: todayISO(), descrizione: "", tipo: "Uscita", importo: "", membroId: "", contoId: "", categoriaId: "", note: ""});

function Movimenti({data, log, utente, mobile, nuovoSegnale}) {
  const {movimenti, membri, conti, categorie} = data;
  const [edit, setEdit] = useState(null);
  const [imp, setImp] = useState(false);
  const [filtri, setFiltri] = useState(false);
  const [f, setF] = useState({mese: mKey(todayISO()), membro: "", conto: "", categoria: "", tipo: "", q: ""});

  useEffect(() => { if (nuovoSegnale) setEdit(VUOTO_MOV()); }, [nuovoSegnale]);

  const mesi = useMemo(() => {
    const s = new Set(movimenti.map(m => mKey(m.data)).filter(Boolean));
    s.add(mKey(todayISO()));
    return Array.from(s).sort().reverse();
  }, [movimenti]);
  const lista = useMemo(() => movimenti.filter(m => {
    if (f.mese && mKey(m.data) !== f.mese) return false;
    if (f.membro && m.membroId !== f.membro) return false;
    if (f.conto && m.contoId !== f.conto) return false;
    if (f.categoria && m.categoriaId !== f.categoria) return false;
    if (f.tipo && m.tipo !== f.tipo) return false;
    if (f.q && !String(m.descrizione || "").toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  }).sort((a, b) => String(b.data).localeCompare(String(a.data))), [movimenti, f]);

  const tot = lista.reduce((s, m) => s + (m.tipo === "Entrata" ? num(m.importo) : -num(m.importo)), 0);
  const nome = (arr, id) => { const x = arr.find(a => a.id === id); return x ? x.nome : null; };
  const attivi = ["membro", "conto", "categoria", "tipo", "q"].filter(k => f[k]).length;

  async function salva(m) {
    const id = m.id || uid();
    const rec = {
      data: m.data, descrizione: m.descrizione.trim(), tipo: m.tipo, importo: num(m.importo),
      membroId: m.membroId || "", contoId: m.contoId || "", categoriaId: m.categoriaId || "",
      note: m.note || "", creatoDa: m.creatoDa || utente.username,
      modificatoDa: utente.username, modificatoIl: Date.now()
    };
    await ref("movimenti/" + id).set(rec);
    log(m.id ? "Movimento modificato" : "Movimento aggiunto", rec.descrizione + " · " + eur(rec.importo));
    setEdit(null);
  }
  async function elimina(m) {
    if (!confirm("Eliminare “" + m.descrizione + "”?")) return;
    await ref("movimenti/" + m.id).remove();
    log("Movimento eliminato", m.descrizione + " · " + eur(m.importo));
    setEdit(null);
  }

  return (
    <div>
      {!mobile && <><h1 className="h1">Movimenti</h1>
        <p className="sub">Tutto quello che entra ed esce, per membro, conto e categoria.</p>
        <div className="btnrow" style={{marginBottom: 14}}>
          <button className="btn" onClick={() => setEdit(VUOTO_MOV())}>Aggiungi movimento</button>
          <button className="btn ghost" onClick={() => setImp(true)}>Importa da Excel</button>
        </div></>}

      <div className="chips">
        <button className={"chip" + (!f.mese ? " on" : "")} onClick={() => setF({...f, mese: ""})}>Tutti</button>
        {mesi.slice(0, 14).map(k =>
          <button key={k} className={"chip" + (f.mese === k ? " on" : "")} onClick={() => setF({...f, mese: k})}>{mLabelB(k)}</button>)}
      </div>

      <div className="btnrow" style={{marginBottom: 12}}>
        <button className="btn ghost sm" onClick={() => setFiltri(true)}>
          Filtri{attivi > 0 ? " (" + attivi + ")" : ""}</button>
        {attivi > 0 && <button className="btn ghost sm" onClick={() => setF({mese: f.mese, membro: "", conto: "", categoria: "", tipo: "", q: ""})}>Azzera</button>}
        {mobile && <button className="btn ghost sm" onClick={() => setImp(true)}>Importa Excel</button>}
      </div>

      <div className="card">
        <p className="small muted" style={{margin: "0 0 10px"}}>
          {lista.length} movimenti · saldo <b className={tot < 0 ? "out-c" : "in-c"}>{eur(tot, true)}</b>
        </p>
        {lista.length === 0 ? <Empty>Nessun movimento con questi filtri.</Empty> :
          <div className="list">{lista.slice(0, 300).map(m => {
            const parti = [dBreve(m.data), nome(categorie, m.categoriaId), nome(membri, m.membroId), nome(conti, m.contoId)]
              .filter(Boolean);
            return <Riga key={m.id} titolo={m.descrizione} sotto={parti.join(" · ")}
              importo={(m.tipo === "Entrata" ? "+" : "−") + eur(num(m.importo))}
              colore={m.tipo === "Entrata" ? "in-c" : "out-c"}
              sottoImporto={utente.ruolo === "admin" && m.creatoDa ? m.creatoDa : null}
              onClick={() => setEdit(m)} />;
          })}</div>}
        {lista.length > 300 && <p className="small muted">Mostrati i primi 300. Restringi i filtri per vedere gli altri.</p>}
      </div>

      {filtri && <Sheet title="Filtri" onClose={() => setFiltri(false)}
        footer={<button className="btn" onClick={() => setFiltri(false)}>Vedi i risultati</button>}>
        <Field label="Cerca nella descrizione">
          <input className="inp" value={f.q} onChange={e => setF({...f, q: e.target.value})} /></Field>
        <Field label="Tipo">
          <div className="segment">
            {[["", "Tutti"], ["Entrata", "Entrate"], ["Uscita", "Uscite"]].map(([v, t]) =>
              <button key={v} className={f.tipo === v ? "on" : ""} onClick={() => setF({...f, tipo: v})}>{t}</button>)}
          </div></Field>
        <Field label="Membro">
          <select className="inp" value={f.membro} onChange={e => setF({...f, membro: e.target.value})}>
            <option value="">Tutti</option>{membri.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}</select></Field>
        <Field label="Conto o carta">
          <select className="inp" value={f.conto} onChange={e => setF({...f, conto: e.target.value})}>
            <option value="">Tutti</option>{conti.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}</select></Field>
        <Field label="Categoria">
          <select className="inp" value={f.categoria} onChange={e => setF({...f, categoria: e.target.value})}>
            <option value="">Tutte</option>{categorie.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}</select></Field>
      </Sheet>}

      {edit && <FormMovimento m={edit} data={data} onSave={salva} onDelete={elimina} onClose={() => setEdit(null)} />}
      {imp && <ImportExcel data={data} utente={utente} log={log} onClose={() => setImp(false)} />}
    </div>
  );
}

function FormMovimento({m, data, onSave, onDelete, onClose}) {
  const [v, setV] = useState(m);
  const set = (k, x) => setV(p => ({...p, [k]: x}));
  const cat = data.categorie.filter(c => !c.tipo || c.tipo === "entrambe" ||
    (v.tipo === "Entrata" ? c.tipo === "entrata" : c.tipo === "uscita"));
  const ok = v.data && v.descrizione.trim() && num(v.importo) > 0;
  return (
    <Sheet title={m.id ? "Modifica movimento" : "Nuovo movimento"} onClose={onClose}
      footer={<>
        {m.id && <button className="btn ghost" style={{flex: "0 0 auto"}} onClick={() => onDelete(v)}>Elimina</button>}
        <button className="btn" disabled={!ok} onClick={() => onSave(v)}>Salva</button>
      </>}>
      <Field label="Entrata o uscita">
        <div className="segment">
          <button className={"out " + (v.tipo === "Uscita" ? "on" : "")} onClick={() => set("tipo", "Uscita")}>Uscita</button>
          <button className={"in " + (v.tipo === "Entrata" ? "on" : "")} onClick={() => set("tipo", "Entrata")}>Entrata</button>
        </div></Field>
      <Field label="Importo">
        <input className="inp big num" inputMode="decimal" value={v.importo}
          onChange={e => set("importo", e.target.value)} placeholder="0,00" /></Field>
      <Field label="Descrizione">
        <input className="inp" value={v.descrizione} onChange={e => set("descrizione", e.target.value)} placeholder="es. Spesa Conad" /></Field>
      <Field label="Data"><input className="inp" type="date" value={v.data} onChange={e => set("data", e.target.value)} /></Field>
      <Field label="Chi l'ha sostenuta">
        <select className="inp" value={v.membroId} onChange={e => set("membroId", e.target.value)}>
          <option value="">—</option>{data.membri.map(x => <option key={x.id} value={x.id}>{x.nome}</option>)}</select></Field>
      <Field label="Conto o carta">
        <select className="inp" value={v.contoId} onChange={e => set("contoId", e.target.value)}>
          <option value="">—</option>{data.conti.map(x => <option key={x.id} value={x.id}>{x.nome}</option>)}</select></Field>
      <Field label="Categoria">
        <select className="inp" value={v.categoriaId} onChange={e => set("categoriaId", e.target.value)}>
          <option value="">—</option>{cat.map(x => <option key={x.id} value={x.id}>{x.nome}</option>)}</select></Field>
      <Field label="Note"><input className="inp" value={v.note || ""} onChange={e => set("note", e.target.value)} /></Field>
    </Sheet>
  );
}

/* ─────────── IMPORT EXCEL ─────────── */
const COLONNE = ["Data", "Descrizione", "Tipo", "Importo", "Membro", "Conto", "Categoria", "Note"];

function ImportExcel({data, utente, log, onClose}) {
  const [righe, setRighe] = useState(null);
  const [errore, setErrore] = useState("");
  const [busy, setBusy] = useState(false);
  const [creaMancanti, setCreaMancanti] = useState(true);

  function modello() {
    const ws = XLSX.utils.aoa_to_sheet([COLONNE,
      ["2026-09-01", "Spesa Conad", "Uscita", 62.4, "Mamma", "Conto BPER", "Alimentari", ""],
      ["2026-09-05", "Stipendio", "Entrata", 1850, "Davide", "Conto BPER", "Stipendio", ""]]);
    ws["!cols"] = COLONNE.map(() => ({wch: 18}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Movimenti");
    download("modello-movimenti.xlsx", new Blob([XLSX.write(wb, {bookType: "xlsx", type: "array"})], {type: "application/octet-stream"}));
  }
  function leggi(file) {
    setErrore("");
    const r = new FileReader();
    r.onload = ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type: "array", cellDates: true});
        const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: ""});
        if (!raw.length) { setErrore("Il file non contiene righe."); return; }
        setRighe(raw.map((r0, i) => {
          const get = k => { const key = Object.keys(r0).find(x => x.trim().toLowerCase() === k.toLowerCase()); return key ? r0[key] : ""; };
          const d = excelDate(get("Data"));
          const imp = Math.abs(num(get("Importo")));
          return {
            _n: i + 2, data: d, descrizione: String(get("Descrizione")).trim(),
            tipo: String(get("Tipo")).trim().toLowerCase().startsWith("e") ? "Entrata" : "Uscita",
            importo: imp, membro: String(get("Membro")).trim(), conto: String(get("Conto")).trim(),
            categoria: String(get("Categoria")).trim(), note: String(get("Note")).trim(),
            _err: !d ? "data non valida" : (imp <= 0 ? "importo mancante" : "")
          };
        }));
      } catch (ex) { setErrore("Non riesco a leggere il file: " + ex.message); }
    };
    r.readAsArrayBuffer(file);
  }
  const valide = righe ? righe.filter(r => !r._err) : [];
  const scartate = righe ? righe.filter(r => r._err) : [];
  const trova = (arr, n) => arr.find(x => String(x.nome).trim().toLowerCase() === String(n).trim().toLowerCase());
  const mancanti = useMemo(() => {
    if (!righe) return {membri: [], conti: [], categorie: []};
    const a = new Set(), b = new Set(), c = new Set();
    valide.forEach(r => {
      if (r.membro && !trova(data.membri, r.membro)) a.add(r.membro);
      if (r.conto && !trova(data.conti, r.conto)) b.add(r.conto);
      if (r.categoria && !trova(data.categorie, r.categoria)) c.add(r.categoria);
    });
    return {membri: [...a], conti: [...b], categorie: [...c]};
  }, [righe, data]);

  async function importa() {
    setBusy(true);
    try {
      const mM = {}, mC = {}, mK = {};
      data.membri.forEach(x => mM[x.nome.toLowerCase()] = x.id);
      data.conti.forEach(x => mC[x.nome.toLowerCase()] = x.id);
      data.categorie.forEach(x => mK[x.nome.toLowerCase()] = x.id);
      if (creaMancanti) {
        for (const n of mancanti.membri) { const i = uid(); await ref("membri/" + i).set({nome: n}); mM[n.toLowerCase()] = i; }
        for (const n of mancanti.conti) { const i = uid(); await ref("conti/" + i).set({nome: n, tipo: "conto", saldoIniziale: 0, dataSaldo: ""}); mC[n.toLowerCase()] = i; }
        for (const n of mancanti.categorie) { const i = uid(); await ref("categorie/" + i).set({nome: n, tipo: "entrambe"}); mK[n.toLowerCase()] = i; }
      }
      const batch = {};
      valide.forEach(r => {
        batch[uid()] = {
          data: r.data, descrizione: r.descrizione || "(senza descrizione)", tipo: r.tipo, importo: r.importo,
          membroId: mM[r.membro.toLowerCase()] || "", contoId: mC[r.conto.toLowerCase()] || "",
          categoriaId: mK[r.categoria.toLowerCase()] || "", note: r.note,
          creatoDa: utente.username, modificatoDa: utente.username, modificatoIl: Date.now()
        };
      });
      await ref("movimenti").update(batch);
      log("Import da Excel", valide.length + " movimenti importati");
      onClose();
    } catch (ex) { setErrore("Import non riuscito: " + ex.message); setBusy(false); }
  }

  return (
    <Sheet title="Importa da Excel" onClose={onClose} wide
      footer={righe ? <>
        <button className="btn ghost" style={{flex: "0 0 auto"}} onClick={() => setRighe(null)}>Indietro</button>
        <button className="btn" disabled={busy || !valide.length} onClick={importa}>
          {busy ? "Importo…" : "Importa " + valide.length}</button>
      </> : null}>
      <p className="small muted" style={{marginTop: 0}}>
        Colonne attese: {COLONNE.join(", ")}. L'importo va sempre positivo, è la colonna Tipo a dare il segno.
      </p>
      <div className="btnrow" style={{marginBottom: 14}}>
        <button className="btn ghost" onClick={modello}>Scarica il modello</button>
        <label className="btn" style={{cursor: "pointer", display: "inline-flex", alignItems: "center"}}>
          Scegli il file
          <input type="file" accept=".xlsx,.xls,.csv" style={{display: "none"}}
            onChange={e => e.target.files[0] && leggi(e.target.files[0])} /></label>
      </div>
      {errore && <p className="out-c small">{errore}</p>}
      {righe && <>
        <p className="small"><b>{valide.length}</b> righe pronte
          {scartate.length > 0 && <> · <span className="out-c">{scartate.length} scartate</span></>}</p>
        {scartate.length > 0 && <p className="small muted">
          {scartate.slice(0, 6).map(r => "riga " + r._n + " (" + r._err + ")").join(", ")}{scartate.length > 6 ? "…" : ""}</p>}
        {(mancanti.membri.length + mancanti.conti.length + mancanti.categorie.length) > 0 &&
          <div className="card" style={{background: "var(--amber-bg)", borderColor: "#eddcbb"}}>
            <b>Nomi non ancora presenti</b>
            {mancanti.membri.length > 0 && <p className="small" style={{margin: "4px 0 0"}}>Membri: {mancanti.membri.join(", ")}</p>}
            {mancanti.conti.length > 0 && <p className="small" style={{margin: "4px 0 0"}}>Conti: {mancanti.conti.join(", ")}</p>}
            {mancanti.categorie.length > 0 && <p className="small" style={{margin: "4px 0 0"}}>Categorie: {mancanti.categorie.join(", ")}</p>}
            <label className="check" style={{marginTop: 8}}>
              <input type="checkbox" checked={creaMancanti} onChange={e => setCreaMancanti(e.target.checked)} />
              <span>Creali automaticamente durante l'import</span></label>
          </div>}
        <div className="list" style={{marginTop: 10}}>
          {righe.slice(0, 30).map(r => (
            <Riga key={r._n} titolo={r.descrizione || "(senza descrizione)"}
              sotto={[dmy(r.data) || "data ?", r.categoria, r.membro, r.conto].filter(Boolean).join(" · ")}
              importo={eur(r.importo)} colore={r._err ? "muted" : (r.tipo === "Entrata" ? "in-c" : "out-c")} />
          ))}
        </div>
        {righe.length > 30 && <p className="small muted">…e altre {righe.length - 30} righe.</p>}
      </>}
    </Sheet>
  );
}

/* ─────────── SCADENZE ─────────── */
const RICORRENZE = [["nessuna", "Una tantum"], ["mensile", "Ogni mese"], ["bimestrale", "Ogni 2 mesi"],
  ["trimestrale", "Ogni 3 mesi"], ["quadrimestrale", "Ogni 4 mesi"], ["semestrale", "Ogni 6 mesi"], ["annuale", "Ogni anno"]];
const PASSO = {mensile: 1, bimestrale: 2, trimestrale: 3, quadrimestrale: 4, semestrale: 6, annuale: 12};
const VUOTA_SCAD = () => ({descrizione: "", importo: "", dataScadenza: todayISO(), ricorrenza: "nessuna",
  ambito: "famiglia", categoriaId: "", contoId: "", membroId: "", pagata: false, note: ""});

function Scadenze({data, log, utente, mobile, nuovoSegnale}) {
  const {scadenze, categorie, conti} = data;
  const [edit, setEdit] = useState(null);
  const [vista, setVista] = useState("aperte");
  const [ambito, setAmbito] = useState("");
  useEffect(() => { if (nuovoSegnale) setEdit(VUOTA_SCAD()); }, [nuovoSegnale]);

  const oggi = todayISO();
  const lista = scadenze
    .filter(s => vista === "aperte" ? !s.pagata : true)
    .filter(s => ambito ? (s.ambito || "famiglia") === ambito : true)
    .sort((a, b) => String(a.dataScadenza).localeCompare(String(b.dataScadenza)));
  const tot = lista.filter(s => !s.pagata).reduce((a, s) => a + num(s.importo), 0);

  async function salva(s) {
    const id = s.id || uid();
    await ref("scadenze/" + id).set({
      descrizione: s.descrizione.trim(), importo: num(s.importo), dataScadenza: s.dataScadenza,
      ricorrenza: s.ricorrenza || "nessuna", ambito: s.ambito || "famiglia",
      categoriaId: s.categoriaId || "", contoId: s.contoId || "", membroId: s.membroId || "",
      pagata: !!s.pagata, note: s.note || "", modificatoDa: utente.username, modificatoIl: Date.now()
    });
    log(s.id ? "Scadenza modificata" : "Scadenza aggiunta", s.descrizione);
    setEdit(null);
  }
  async function pagata(s) {
    await ref("scadenze/" + s.id).update({pagata: true, modificatoDa: utente.username, modificatoIl: Date.now()});
    log("Scadenza pagata", s.descrizione + " · " + eur(s.importo));
    const passo = PASSO[s.ricorrenza];

      await ref("scadenze/" + uid()).set({...base, pagata: false, dataScadenza: dateInMonth(addMonths(mKey(s.dataScadenza), passo), giorno)});
    }

  async function elimina(s) {
    if (!confirm("Eliminare “" + s.descrizione + "”?")) return;

  return (

        <Field label="Descrizione">

        <Field label="Note"><input className="inp" value={edit.note || ""} onChange={e => setEdit({...edit, note: e.target.value})} /></Field>

const MAX_ALLEGATO = 700 * 1024;
const VUOTA_BOLL = (ambito) => ({ambito, fornitore: "", tipo: "Luce", periodo: "", importo: "",
  dataScadenza: todayISO(), pagata: false, note: "", allegato: null, linkEsterno: ""});

function Bollette({data, log, utente, mobile, nuovoSegnale}) {
  const [ambito, setAmbito] = useState("famiglia");
  const [edit, setEdit] = useState(null);
  useEffect(() => { if (nuovoSegnale) setEdit(VUOTA_BOLL(ambito)); }, [nuovoSegnale]);

  const lista = data.bollette.filter(b => (b.ambito || "famiglia") === ambito)
    .sort((a, b) => String(b.dataScadenza || "").localeCompare(String(a.dataScadenza || "")));
  const anno = String(new Date().getFullYear());
  const totAnno = lista.filter(b => String(b.dataScadenza || "").slice(0, 4) === anno).reduce((s, b) => s + num(b.importo), 0);

  async function salva(b) {
    const id = b.id || uid();
    await ref("bollette/" + id).set({
      ambito: b.ambito, fornitore: b.fornitore.trim(), tipo: b.tipo, periodo: b.periodo || "",
      importo: num(b.importo), dataScadenza: b.dataScadenza || "", pagata: !!b.pagata,
      note: b.note || "", allegato: b.allegato || null, linkEsterno: b.linkEsterno || "",
      modificatoDa: utente.username, modificatoIl: Date.now()
    });
    log(b.id ? "Bolletta modificata" : "Bolletta aggiunta", b.fornitore + " · " + b.tipo);
    setEdit(null);
  }
  async function elimina(b) {
    if (!confirm("Eliminare questa bolletta?")) return;
    await ref("bollette/" + b.id).remove(); log("Bolletta eliminata", b.fornitore + " · " + b.tipo); setEdit(null);
  }

  return (
    <div>
      {!mobile && <><h1 className="h1">Bollette</h1>
        <p className="sub">Divise tra la casa di famiglia e l'appartamento in affitto, con il documento allegato.</p>
        <div className="btnrow" style={{marginBottom: 14}}>
          <button className="btn" onClick={() => setEdit(VUOTA_BOLL(ambito))}>Aggiungi bolletta</button></div></>}

      <div className="segment" style={{marginBottom: 14}}>
        <button className={ambito === "famiglia" ? "on" : ""} onClick={() => setAmbito("famiglia")}>Famiglia</button>
        <button className={ambito === "appartamento" ? "on" : ""} onClick={() => setAmbito("appartamento")}>Appartamento</button>
      </div>

      <div className="card">
        <p className="small muted" style={{margin: "0 0 10px"}}>Totale {anno}: <b className="num">{eur(totAnno)}</b></p>
        {lista.length === 0 ? <Empty>Nessuna bolletta per questo ambito.</Empty> :
          <div className="list">{lista.map(b => (
            <Riga key={b.id} titolo={b.fornitore + " · " + b.tipo}
              sotto={<>{dBreve(b.dataScadenza)}{b.periodo ? " · " + b.periodo : ""}{" "}
                {b.pagata ? <span className="pill in">pagata</span> : <span className="pill warn">da pagare</span>}
                {(b.allegato || b.linkEsterno) && <span className="pill">documento</span>}</>}
              importo={eur(b.importo)} onClick={() => setEdit(b)} />
          ))}</div>}
      </div>

      {edit && <FormBolletta b={edit} onSave={salva} onDelete={elimina} onClose={() => setEdit(null)} />}
    </div>
  );
}

function FormBolletta({b, onSave, onDelete, onClose}) {
  const [v, setV] = useState(b);
  const [msg, setMsg] = useState("");
  const set = (k, x) => setV(p => ({...p, [k]: x}));
  function carica(file) {
    setMsg("");
    if (file.size > MAX_ALLEGATO) {
      setMsg("Il file pesa " + Math.round(file.size / 1024) + " KB, il limite è 700 KB. Comprimilo oppure incolla un link.");
      return;
    }
    const r = new FileReader();
    r.onload = e => set("allegato", {nome: file.name, mime: file.type || "application/octet-stream", dataUrl: e.target.result});
    r.readAsDataURL(file);
  }
  function apri() {
    const w = window.open();
    if (v.allegato.mime.startsWith("image/")) w.document.write('<img src="' + v.allegato.dataUrl + '" style="max-width:100%">');
    else w.location = v.allegato.dataUrl;
  }
  return (
    <Sheet title={b.id ? "Bolletta" : "Nuova bolletta"} onClose={onClose}
      footer={<button className="btn" disabled={!v.fornitore.trim()} onClick={() => onSave(v)}>Salva</button>}>
      <Field label="Importo">
        <input className="inp big num" inputMode="decimal" value={v.importo} onChange={e => set("importo", e.target.value)} placeholder="0,00" /></Field>
      <Field label="Ambito">
        <div className="segment">
          <button className={v.ambito === "famiglia" ? "on" : ""} onClick={() => set("ambito", "famiglia")}>Famiglia</button>
          <button className={v.ambito === "appartamento" ? "on" : ""} onClick={() => set("ambito", "appartamento")}>Appartamento</button>
        </div></Field>
      <Field label="Tipo">
        <select className="inp" value={v.tipo} onChange={e => set("tipo", e.target.value)}>
          {["Luce", "Gas", "Acqua", "Rifiuti", "Telefono e internet", "Condominio", "Altro"].map(t => <option key={t}>{t}</option>)}</select></Field>
      <Field label="Fornitore"><input className="inp" value={v.fornitore} onChange={e => set("fornitore", e.target.value)} placeholder="es. Enel" /></Field>
      <Field label="Periodo"><input className="inp" value={v.periodo} onChange={e => set("periodo", e.target.value)} placeholder="es. lug–ago 2026" /></Field>
      <Field label="Scadenza"><input className="inp" type="date" value={v.dataScadenza} onChange={e => set("dataScadenza", e.target.value)} /></Field>
      <Field label="Stato">
        <div className="segment">
          <button className={!v.pagata ? "on" : ""} onClick={() => set("pagata", false)}>Da pagare</button>
          <button className={v.pagata ? "on" : ""} onClick={() => set("pagata", true)}>Pagata</button>
        </div></Field>
      <Field label="Documento (foto o PDF, max 700 KB)">
        <div className="btnrow">
          <label className="btn ghost sm" style={{cursor: "pointer", display: "inline-flex", alignItems: "center"}}>
            {v.allegato ? "Sostituisci" : "Carica"}
            <input type="file" accept=".pdf,image/*" style={{display: "none"}}
              onChange={e => e.target.files[0] && carica(e.target.files[0])} /></label>
          {v.allegato && <>
            <button className="btn ghost sm" onClick={apri}>Apri</button>
            <button className="btn ghost sm" onClick={() => set("allegato", null)}>Rimuovi</button></>}
        </div>
        {v.allegato && <p className="small muted" style={{marginBottom: 0}}>{v.allegato.nome}</p>}
      </Field>
      {msg && <p className="small warn-c">{msg}</p>}
      <Field label="Oppure un link (Drive, area clienti…)">
        <input className="inp" inputMode="url" value={v.linkEsterno || ""} onChange={e => set("linkEsterno", e.target.value)} placeholder="https://" /></Field>
      <Field label="Note"><input className="inp" value={v.note || ""} onChange={e => set("note", e.target.value)} /></Field>
      {b.id && <button className="btn ghost wide" onClick={() => onDelete(v)}>Elimina bolletta</button>}
    </Sheet>
  );
}

/* ─────────── motore previsione ─────────── */
function calcolaSaldi(conti, movimenti) {
  const s = {};
  conti.forEach(c => { s[c.id] = num(c.saldoIniziale); });
  const oggi = todayISO();
  movimenti.forEach(m => {
    if (!m.contoId || s[m.contoId] === undefined) return;
    if (String(m.data) > oggi) return;
    const c = conti.find(x => x.id === m.contoId);
    if (c && c.dataSaldo && String(m.data) < c.dataSaldo) return;
    s[m.contoId] += (m.tipo === "Entrata" ? 1 : -1) * num(m.importo);
  });
  return s;
}

function previsione(data, saldi, par) {
  const {movimenti, conti, categorie, scadenze} = data;
  const oggi = todayISO(), meseCorr = mKey(oggi);
  const nMesi = par.mesi || 6, storico = par.storico || 6;
  const correnti = conti.filter(c => c.tipo !== "carta");
  const carte = conti.filter(c => c.tipo === "carta");
  const esclusa = id => { const c = categorie.find(x => x.id === id); return c && c.escludiDaPrevisione; };

  const mesiStorico = [];
  for (let i = 1; i <= storico; i++) mesiStorico.push(addMonths(meseCorr, -i));
  const media = f => {
    let t = 0;
    mesiStorico.forEach(k => { t += movimenti.filter(m => mKey(m.data) === k && f(m)).reduce((s, m) => s + num(m.importo), 0); });
    return mesiStorico.length ? t / mesiStorico.length : 0;
  };
  const suConto = m => correnti.some(c => c.id === m.contoId);

  const entrateMedie = (par.entrateManuale !== "" && par.entrateManuale != null)
    ? num(par.entrateManuale) : media(m => m.tipo === "Entrata" && suConto(m) && !esclusa(m.categoriaId));
  const usciteMedie = (par.usciteManuale !== "" && par.usciteManuale != null)
    ? num(par.usciteManuale) : media(m => m.tipo === "Uscita" && suConto(m) && !esclusa(m.categoriaId));
  const carteMedie = {};
  carte.forEach(c => { carteMedie[c.id] = media(m => m.tipo === "Uscita" && m.contoId === c.id); });
  const speseCarta = (id, k) => movimenti.filter(m => m.contoId === id && mKey(m.data) === k && m.tipo === "Uscita")
    .reduce((s, m) => s + num(m.importo), 0);

  function scadenzeMese(key) {
    let tot = 0; const voci = [];
    scadenze.forEach(s => {
      if (s.pagata) return;
      const passo = PASSO[s.ricorrenza];
      let k = mKey(s.dataScadenza);
      if (!k) return;
      if (!passo) { if (k === key) { tot += num(s.importo); voci.push(s.descrizione); } return; }
      let g = 0;
      while (k < key && g < 240) { k = addMonths(k, passo); g++; }
      if (k === key) { tot += num(s.importo); voci.push(s.descrizione); }
    });
    return {tot, voci};
  }

  const righe = [];
  let saldo = correnti.reduce((s, c) => s + (saldi[c.id] || 0), 0);
  for (let i = 0; i < nMesi; i++) {
    const key = addMonths(meseCorr, i);
    const iniziale = saldo;
    const gg = daysInMonth(key);
    const quota = i === 0 ? Math.max(0, (gg - Number(oggi.slice(8, 10))) / gg) : 1;
    const entrate = entrateMedie * quota;
    const ordinarie = usciteMedie * quota;
    const {tot: scad, voci} = scadenzeMese(key);
    let addebiti = 0; const dettCarte = [];
    carte.forEach(c => {
      const giorno = Number(c.giornoAddebito) || 15;
      if (dateInMonth(key, giorno) < oggi) return;
      const prec = addMonths(key, -1);
      const reale = speseCarta(c.id, prec);
      const val = prec < meseCorr ? reale : Math.max(reale, carteMedie[c.id] || 0);
      if (val > 0) { addebiti += val; dettCarte.push(c.nome + " " + eur(val)); }
    });
    const imprevisti = (num(par.imprevisti) / 100) * ordinarie;
    const fine = iniziale + entrate - ordinarie - scad - addebiti - imprevisti;
    righe.push({mese: key, saldoInizio: iniziale, entrate, ordinarie, scadenze: scad, vociScadenze: voci,
      addebiti, dettCarte, imprevisti, saldoFine: fine});
    saldo = fine;
  }
  return {righe, soglia: num(par.soglia), entrateMedie, usciteMedie};
}

/* ─────────── PREVISIONI ─────────── */
function Previsioni({data, saldi, par, setPar, prev, mobile}) {
  const [dett, setDett] = useState(null);
  const [ipotesi, setIpotesi] = useState(false);
  const set = (k, v) => setPar({...par, [k]: v});
  const correnti = data.conti.filter(c => c.tipo !== "carta");
  const partenza = correnti.reduce((s, c) => s + (saldi[c.id] || 0), 0);

  return (
    <div>
      {!mobile && <><h1 className="h1">Programmazione finanziaria</h1>
        <p className="sub">Se entrate e consumi restano quelli degli ultimi mesi, ecco come si muove la giacenza.</p></>}

      <div className="kpi" style={{marginBottom: 12}}>
        <div className="lab">Si parte da</div>
        <div className="val num">{eur(partenza)}</div>
        <div className="hint">saldo di oggi sui conti correnti</div>
      </div>

      <div className="btnrow" style={{marginBottom: 12}}>
        <button className="btn ghost sm" onClick={() => setIpotesi(true)}>Ipotesi di calcolo</button>
      </div>

      {correnti.length === 0 ? <div className="card"><Empty>Serve almeno un conto corrente per fare la previsione.</Empty></div> :
        <div className="card">
          <div className="list">{prev.righe.map(r => {
            const rosso = r.saldoFine < prev.soglia;
            return (
              <button key={r.mese} className="item" onClick={() => setDett(r)}>
                <span>
                  <span className="t" style={{display: "block"}}>{mLabel(r.mese)}</span>
                  <span className="s" style={{display: "block"}}>
                    entrate {eurK(r.entrate)} · uscite {eurK(r.ordinarie + r.scadenze + r.addebiti + r.imprevisti)}
                  </span>
                  {rosso && <span className="pill warn" style={{marginTop: 4, display: "inline-block"}}>sotto soglia</span>}
                </span>
                <span className={"amt num " + (rosso ? "warn-c" : "")}>{eurK(r.saldoFine)}<small>a fine mese</small></span>
              </button>);
          })}</div>
          <p className="small muted" style={{marginBottom: 0, marginTop: 10}}>
            Soglia di sicurezza impostata a {eur(prev.soglia)}. Tocca un mese per il dettaglio.
          </p>
        </div>}

      {ipotesi && <Sheet title="Ipotesi di calcolo" onClose={() => setIpotesi(false)}
        footer={<button className="btn" onClick={() => setIpotesi(false)}>Fatto</button>}>
        <Field label="Mesi da proiettare">
          <select className="inp" value={par.mesi} onChange={e => set("mesi", Number(e.target.value))}>
            {[3, 6, 9, 12, 18, 24].map(n => <option key={n} value={n}>{n} mesi</option>)}</select></Field>
        <Field label="Storico usato per le medie">
          <select className="inp" value={par.storico} onChange={e => set("storico", Number(e.target.value))}>
            {[3, 6, 12].map(n => <option key={n} value={n}>ultimi {n} mesi</option>)}</select></Field>
        <Field label="Soglia di sicurezza sul conto">
          <input className="inp num" inputMode="decimal" value={par.soglia} onChange={e => set("soglia", e.target.value)} /></Field>
        <Field label="Margine per imprevisti (% sulle uscite)">
          <input className="inp num" inputMode="decimal" value={par.imprevisti} onChange={e => set("imprevisti", e.target.value)} /></Field>
        <Field label={"Entrate mensili — media calcolata: " + eur(prev.entrateMedie)}>
          <input className="inp num" inputMode="decimal" placeholder="vuoto = usa la media"
            value={par.entrateManuale} onChange={e => set("entrateManuale", e.target.value)} /></Field>
        <Field label={"Consumi mensili — media calcolata: " + eur(prev.usciteMedie)}>
          <input className="inp num" inputMode="decimal" placeholder="vuoto = usa la media"
            value={par.usciteManuale} onChange={e => set("usciteManuale", e.target.value)} /></Field>
        <p className="small muted">
          Le medie escludono le categorie marcate come fuori previsione. Le spese sulle carte non entrano nei consumi:
          rientrano come addebito il mese successivo.
        </p>
      </Sheet>}

      {dett && <Sheet title={mLabel(dett.mese)} onClose={() => setDett(null)}
        footer={<button className="btn" onClick={() => setDett(null)}>Chiudi</button>}>
        <div className="rowline"><span>Saldo iniziale</span><b className="num">{eur(dett.saldoInizio)}</b></div>
        <div className="rowline"><span>Entrate previste</span><b className="num in-c">{eur(dett.entrate)}</b></div>
        <div className="rowline"><span>Consumi ordinari</span><b className="num">−{eur(dett.ordinarie)}</b></div>
        <div className="rowline"><span>Scadenze
          {dett.vociScadenze.length > 0 && <div className="small muted">{dett.vociScadenze.join(", ")}</div>}</span>
          <b className="num">−{eur(dett.scadenze)}</b></div>
        <div className="rowline"><span>Addebiti carte
          {dett.dettCarte.length > 0 && <div className="small muted">{dett.dettCarte.join(", ")}</div>}</span>
          <b className="num">−{eur(dett.addebiti)}</b></div>
        <div className="rowline"><span>Margine imprevisti</span><b className="num">−{eur(dett.imprevisti)}</b></div>
        <div className="rowline" style={{fontSize: 18}}><b>Saldo finale</b><b className="num">{eur(dett.saldoFine)}</b></div>
      </Sheet>}
    </div>
  );

function Conti({data, saldi, log}) {
  const [edit, setEdit] = useState(null);
  async function salva(c) {
    const id = c.id || uid();
    await ref("conti/" + id).set({
      nome: c.nome.trim(), tipo: c.tipo, intestatario: c.intestatario || "",
      saldoIniziale: num(c.saldoIniziale), dataSaldo: c.dataSaldo || "",
      contoAddebito: c.tipo === "carta" ? (c.contoAddebito || "") : "",
      giornoAddebito: c.tipo === "carta" ? (Number(c.giornoAddebito) || 15) : null
    });
    log(c.id ? "Conto modificato" : "Conto aggiunto", c.nome); setEdit(null);
  }
  async function elimina(c) {
    if (!confirm("Eliminare " + c.nome + "? I movimenti restano ma senza conto.")) return;
    await ref("conti/" + c.id).remove(); log("Conto eliminato", c.nome); setEdit(null);
  }
  return (
    <div className="card">
      <div className="cardhead"><span className="h2">Conti e carte</span>
        <button className="btn sm" onClick={() => setEdit({nome: "", tipo: "conto", intestatario: "", saldoIniziale: "", dataSaldo: todayISO(), contoAddebito: "", giornoAddebito: 15})}>Aggiungi</button></div>
      {data.conti.length === 0 ? <Empty>Inserisci i conti correnti e le carte della famiglia.</Empty> :
        <div className="list">{data.conti.map(c => {
          const m = data.membri.find(x => x.id === c.intestatario);
          const dest = data.conti.find(x => x.id === c.contoAddebito);
          return <Riga key={c.id} titolo={c.nome}
            sotto={[c.tipo === "carta" ? "Carta" : "Conto", m ? m.nome : null,
              c.tipo === "carta" && dest ? "addebito su " + dest.nome + " il " + (c.giornoAddebito || 15) : null]
              .filter(Boolean).join(" · ")}
            importo={eur(saldi[c.id] || 0)} colore={(saldi[c.id] || 0) < 0 ? "out-c" : ""}
            onClick={() => setEdit(c)} />;
        })}</div>}

      {edit && <Sheet title={edit.id ? "Conto" : "Nuovo conto"} onClose={() => setEdit(null)}
        footer={<button className="btn" disabled={!edit.nome.trim()} onClick={() => salva(edit)}>Salva</button>}>
        <Field label="Tipo">
          <div className="segment">
            <button className={edit.tipo === "conto" ? "on" : ""} onClick={() => setEdit({...edit, tipo: "conto"})}>Conto corrente</button>
            <button className={edit.tipo === "carta" ? "on" : ""} onClick={() => setEdit({...edit, tipo: "carta"})}>Carta di credito</button>
          </div></Field>
        <Field label="Nome"><input className="inp" value={edit.nome} onChange={e => setEdit({...edit, nome: e.target.value})} placeholder="es. Conto BPER papà" /></Field>
        <Field label="Intestatario">
          <select className="inp" value={edit.intestatario} onChange={e => setEdit({...edit, intestatario: e.target.value})}>
            <option value="">—</option>{data.membri.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}</select></Field>
        <Field label="Saldo iniziale">
          <input className="inp num" inputMode="decimal" value={edit.saldoIniziale} onChange={e => setEdit({...edit, saldoIniziale: e.target.value})} /></Field>
        <Field label="Alla data del">
          <input className="inp" type="date" value={edit.dataSaldo} onChange={e => setEdit({...edit, dataSaldo: e.target.value})} /></Field>
        {edit.tipo === "carta" && <>
          <Field label="Conto su cui viene addebitata">
            <select className="inp" value={edit.contoAddebito} onChange={e => setEdit({...edit, contoAddebito: e.target.value})}>
              <option value="">—</option>{data.conti.filter(c => c.tipo !== "carta").map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}</select></Field>
          <Field label="Giorno di addebito del mese dopo">
            <input className="inp num" type="number" min="1" max="28" value={edit.giornoAddebito}
              onChange={e => setEdit({...edit, giornoAddebito: e.target.value})} /></Field>
        </>}
        <p className="small muted">Il saldo iniziale è quello alla data indicata: i movimenti precedenti non vengono conteggiati.</p>
        {edit.id && <button className="btn ghost wide" onClick={() => elimina(edit)}>Elimina conto</button>}
      </Sheet>}
    </div>
  );
}

function Categorie({data, log}) {
  const [edit, setEdit] = useState(null);
  const [nome, setNome] = useState("");
  const [tipoNuova, setTipoNuova] = useState("uscita");

  const usi = useMemo(() => {
    const m = {};
    data.movimenti.forEach(x => { if (x.categoriaId) m[x.categoriaId] = (m[x.categoriaId] || 0) + 1; });
    data.scadenze.forEach(x => { if (x.categoriaId) m[x.categoriaId] = (m[x.categoriaId] || 0) + 1; });
    return m;
  }, [data.movimenti, data.scadenze]);

  const uscite = data.categorie.filter(c => (c.tipo || "uscita") === "uscita");
  const entrate = data.categorie.filter(c => c.tipo === "entrata");
  const miste = data.categorie.filter(c => c.tipo === "entrambe");

  async function aggiungi() {
    const n = nome.trim();
    if (!n) return;
    if (data.categorie.some(c => c.nome.toLowerCase() === n.toLowerCase())) {
      alert("Esiste già una categoria con questo nome."); return;
    }
    await ref("categorie/" + uid()).set({nome: n, tipo: tipoNuova, escludiDaPrevisione: false});
    log("Categoria aggiunta", n); setNome("");
  }
  async function salva(c) {
    await ref("categorie/" + c.id).set({nome: c.nome.trim(), tipo: c.tipo, escludiDaPrevisione: !!c.escludiDaPrevisione});
    log("Categoria modificata", c.nome); setEdit(null);
  }
  async function elimina(c) {
    const n = usi[c.id] || 0;
    const testo = n > 0
      ? "“" + c.nome + "” è usata in " + n + (n === 1 ? " movimento o scadenza" : " tra movimenti e scadenze") +
        ".\nEliminandola quelle voci restano, ma senza categoria. Procedo?"
      : "Eliminare la categoria “" + c.nome + "”?";
    if (!confirm(testo)) return;
    await ref("categorie/" + c.id).remove();
    log("Categoria eliminata", c.nome); setEdit(null);
  }

  const blocco = (titolo, arr) => arr.length === 0 ? null : (
    <div style={{marginBottom: 14}}>
      <p className="f" style={{marginBottom: 2}}>{titolo}</p>
      <div className="list">{arr.map(c => (
        <Riga key={c.id} titolo={c.nome}
          sotto={[(usi[c.id] || 0) + (usi[c.id] === 1 ? " utilizzo" : " utilizzi"),
            c.escludiDaPrevisione ? "fuori previsione" : null].filter(Boolean).join(" · ")}
          importo="›" onClick={() => setEdit(c)} />
      ))}</div>
    </div>
  );

  return (
    <div className="card">
      <div className="cardhead"><span className="h2">Categorie</span>
        <span className="small muted">{data.categorie.length} in tutto</span></div>

      <Field label="Nuova categoria">
        <input className="inp" value={nome} placeholder="es. Palestra"
          onChange={e => setNome(e.target.value)} onKeyDown={e => e.key === "Enter" && aggiungi()} /></Field>
      <div className="segment" style={{marginBottom: 10}}>
        <button className={"out " + (tipoNuova === "uscita" ? "on" : "")} onClick={() => setTipoNuova("uscita")}>Uscita</button>
        <button className={"in " + (tipoNuova === "entrata" ? "on" : "")} onClick={() => setTipoNuova("entrata")}>Entrata</button>
        <button className={tipoNuova === "entrambe" ? "on" : ""} onClick={() => setTipoNuova("entrambe")}>Entrambe</button>
      </div>
      <button className="btn wide" style={{marginBottom: 18}} disabled={!nome.trim()} onClick={aggiungi}>Aggiungi categoria</button>

      {data.categorie.length === 0 ? <Empty>Nessuna categoria.</Empty> : <>
        {blocco("Uscite", uscite)}
        {blocco("Entrate", entrate)}
        {blocco("Entrate e uscite", miste)}
      </>}

      {edit && <Sheet title="Modifica categoria" onClose={() => setEdit(null)}
        footer={<>
          <button className="btn ghost" style={{flex: "0 0 auto"}} onClick={() => elimina(edit)}>Elimina</button>
          <button className="btn" disabled={!edit.nome.trim()} onClick={() => salva(edit)}>Salva</button>
        </>}>
        <Field label="Nome">
          <input className="inp" value={edit.nome} onChange={e => setEdit({...edit, nome: e.target.value})} /></Field>
        <Field label="Vale per">
          <div className="segment">
            <button className={"out " + ((edit.tipo || "uscita") === "uscita" ? "on" : "")} onClick={() => setEdit({...edit, tipo: "uscita"})}>Uscita</button>
            <button className={"in " + (edit.tipo === "entrata" ? "on" : "")} onClick={() => setEdit({...edit, tipo: "entrata"})}>Entrata</button>
            <button className={edit.tipo === "entrambe" ? "on" : ""} onClick={() => setEdit({...edit, tipo: "entrambe"})}>Entrambe</button>
          </div></Field>
        <label className="check">
          <input type="checkbox" checked={!!edit.escludiDaPrevisione}
            onChange={e => setEdit({...edit, escludiDaPrevisione: e.target.checked})} />
          <span>Tieni fuori dalle medie della previsione (giroconti, addebiti carta, partite straordinarie)</span></label>
        <p className="small muted">
          Usata in {usi[edit.id] || 0} tra movimenti e scadenze. Se rinomini la categoria, tutte le voci collegate si aggiornano da sole.
        </p>
      </Sheet>}
    </div>
  );
}

/* ─────────── UTENTI ─────────── */
function Utenti({utenti, log, utente, mobile}) {
  const [nuovo, setNuovo] = useState(null);
  const [pwd, setPwd] = useState(null);
  const lista = obj2arr(utenti).sort((a, b) => String(a.username).localeCompare(String(b.username)));
  async function crea(v) {
    if (lista.some(u => u.username.toLowerCase() === v.username.trim().toLowerCase())) { alert("Esiste già un utente con questo nome."); return; }
    await ref("utenti/" + uid()).set({username: v.username.trim(), nome: v.nome.trim(), ruolo: v.ruolo,
      passwordHash: await sha256(v.password), creatoIl: Date.now(), creatoDa: utente.username});
    log("Utente creato", v.username.trim() + " (" + v.ruolo + ")"); setNuovo(null);
  }
  async function cambia(u, p) {
    await ref("utenti/" + u.id + "/passwordHash").set(await sha256(p));
    log("Password cambiata", u.username); setPwd(null);
  }
  async function elimina(u) {
    if (u.id === utente.id) { alert("Non puoi eliminare l'utente con cui sei collegato."); return; }
    if (!confirm("Eliminare l'utente " + u.username + "?")) return;
    await ref("utenti/" + u.id).remove(); log("Utente eliminato", u.username);
  }
  return (
    <div>
      {!mobile && <><h1 className="h1">Utenti</h1><p className="sub">Chi può entrare nell'app e con quale ruolo.</p></>}
      <div className="btnrow" style={{marginBottom: 12}}>
        <button className="btn" onClick={() => setNuovo({username: "", nome: "", password: "", ruolo: "utente"})}>Crea utente</button></div>
      <div className="card">
        <div className="list">{lista.map(u => (
          <div className="item" key={u.id}>
            <span>
              <span className="t" style={{display: "block"}}>{u.username}</span>
              <span className="s" style={{display: "block"}}>{u.nome || "—"} ·{" "}
                {u.ruolo === "admin" ? "amministratore" : "familiare"}</span>
            </span>
            <span style={{display: "flex", gap: 6}}>
              <button className="btn ghost sm" onClick={() => setPwd({u, p: ""})}>Password</button>
              <button className="btn ghost sm" onClick={() => elimina(u)}>Elimina</button>
            </span>
          </div>))}</div>
      </div>

      {nuovo && <Sheet title="Nuovo utente" onClose={() => setNuovo(null)}
        footer={<button className="btn" disabled={!nuovo.username.trim() || nuovo.password.length < 3} onClick={() => crea(nuovo)}>Crea utente</button>}>
        <Field label="Nome utente"><input className="inp" autoCapitalize="none" value={nuovo.username}
          onChange={e => setNuovo({...nuovo, username: e.target.value})} /></Field>
        <Field label="Persona"><input className="inp" value={nuovo.nome}
          onChange={e => setNuovo({...nuovo, nome: e.target.value})} placeholder="es. Mamma" /></Field>
        <Field label="Password"><input className="inp" value={nuovo.password}
          onChange={e => setNuovo({...nuovo, password: e.target.value})} /></Field>
        <Field label="Ruolo">
          <div className="segment">
            <button className={nuovo.ruolo === "utente" ? "on" : ""} onClick={() => setNuovo({...nuovo, ruolo: "utente"})}>Familiare</button>
            <button className={nuovo.ruolo === "admin" ? "on" : ""} onClick={() => setNuovo({...nuovo, ruolo: "admin"})}>Amministratore</button>
          </div></Field>
        <p className="small muted">Solo gli amministratori vedono chi ha inserito ogni movimento e il registro attività.</p>
      </Sheet>}

      {pwd && <Sheet title={"Password di " + pwd.u.username} onClose={() => setPwd(null)}
        footer={<button className="btn" disabled={pwd.p.length < 3} onClick={() => cambia(pwd.u, pwd.p)}>Cambia password</button>}>
        <Field label="Nuova password"><input className="inp" value={pwd.p} onChange={e => setPwd({...pwd, p: e.target.value})} /></Field>
      </Sheet>}
    </div>
  );
}

  ["bollette", "Bollette", "❑"], ["previsioni", "Previsione", "◇"], ["anagrafiche", "Anagrafiche", "☰"]];

const PAR_DEFAULT = {mesi: 6, storico: 6, soglia: 2000, imprevisti: 10, entrateManuale: "", usciteManuale: ""};

function Avvio({testo, errore}) {

function App() {
  const [pronto, setPronto] = useState(false);
  const [errore, setErrore] = useState("");
  useEffect(() => {
    let vivo = true;
    firebase.auth().signInAnonymously()
      .then(() => { if (vivo) setPronto(true); })
      .catch(e => { if (vivo) setErrore("Connessione a Firebase non riuscita: " + e.message); });
    return () => { vivo = false; };
  }, []);
  if (errore) return <Avvio testo="Non riesco a collegarmi al database." errore={errore} />;
  if (!pronto) return <Avvio testo="Collegamento in corso…" />;
  return <AppCollegata />;
}

function AppCollegata() {
  const [utente, setUtente] = useState(null);
  const [sessione, setSessione] = useState(leggiSessione);
  const [pag, setPag] = useState("dashboard");
  const [altro, setAltro] = useState(false);
  const [toast, setToast] = useState("");
  const [par, setParState] = useState(PAR_DEFAULT);
  const [nuovoSegnale, setNuovoSegnale] = useState(0);
  const seminato = useRef(false);
  const mobile = useMobile();

  const utenti = useNode("utenti");
  const movimentiN = useNode("movimenti");
  const membriN = useNode("membri");
  const contiN = useNode("conti");
  const categorieN = useNode("categorie");
  const scadenzeN = useNode("scadenze");
  const bolletteN = useNode("bollette");
  const registro = useNode("registro");
  const parN = useNode("parametri");

  useEffect(() => {
    if (utenti === undefined) return;
    if (utenti && Object.keys(utenti).length > 0) return;
    if (seminato.current) return;
    seminato.current = true;
    (async () => {
      await ref("utenti/" + uid()).set({username: "admin", nome: "Davide", ruolo: "admin", passwordHash: await sha256("dado"), creatoIl: Date.now()});
      const base = [
        ["Alimentari", "uscita", false], ["Salute e medicinali", "uscita", false], ["Utenze", "uscita", false],
        ["Casa e manutenzioni", "uscita", false], ["Trasporti e carburante", "uscita", false],
        ["Assicurazioni", "uscita", false], ["Tasse e bolli", "uscita", false], ["Svago", "uscita", false],
        ["Vacanze", "uscita", false], ["Spese impreviste", "uscita", false], ["Appartamento in affitto", "entrambe", false],
        ["Stipendio", "entrata", false], ["Altre entrate", "entrata", false],
        ["Addebito carta", "uscita", true], ["Giroconto", "entrambe", true]
      ];
      const b = {};
      base.forEach(([nome, tipo, ex]) => { b[uid()] = {nome, tipo, escludiDaPrevisione: ex}; });
      await ref("categorie").update(b);
    })();
  }, [utenti]);

  useEffect(() => { if (parN) setParState({...PAR_DEFAULT, ...parN}); }, [parN]);

  // riprende la sessione salvata sul dispositivo
  useEffect(() => {
    if (utente || !sessione || utenti === undefined) return;
    if (utenti && utenti[sessione]) setUtente({id: sessione, ...utenti[sessione]});
    else { setSessione(null); scriviSessione(null); }   // utente rimosso nel frattempo
  }, [utente, sessione, utenti]);

  const entra = useCallback(u => {
    setUtente(u); setSessione(u.id); scriviSessione(u.id);
    ref("registro/" + uid()).set({utente: u.username, azione: "Accesso", dettaglio: "", ts: Date.now()});
  }, []);
  const esci = useCallback(() => {
    if (!confirm("Vuoi uscire? Alla prossima apertura ti verrà richiesta la password.")) return;
    setUtente(null); setSessione(null); scriviSessione(null); setAltro(false);
  }, []);
  const setPar = useCallback(p => { setParState(p); ref("parametri").set(p); }, []);
  const log = useCallback((azione, dettaglio) => {
    if (!utente) return;
    ref("registro/" + uid()).set({utente: utente.username, azione, dettaglio: dettaglio || "", ts: Date.now()});
    setToast(azione);
    setTimeout(() => setToast(""), 1700);
  }, [utente]);

  const data = useMemo(() => ({
    movimenti: obj2arr(movimentiN),
    membri: obj2arr(membriN).sort(byName),
    conti: obj2arr(contiN).sort(byName),
    categorie: obj2arr(categorieN).sort(byName),
    scadenze: obj2arr(scadenzeN),
    bollette: obj2arr(bolletteN)
  }), [movimentiN, membriN, contiN, categorieN, scadenzeN, bolletteN]);

  const saldi = useMemo(() => calcolaSaldi(data.conti, data.movimenti), [data]);
  const prev = useMemo(() => previsione(data, saldi, par), [data, saldi, par]);

  if (utenti === undefined) return <Avvio testo="Carico i dati…" />;
  if (!utenti || Object.keys(utenti).length === 0) return <Avvio testo="Preparo il primo accesso…" />;
  if (!utente && sessione) return <Avvio testo="Ti riconosco, un attimo…" />;
  if (!utente) return <Login utenti={utenti} onLogin={entra} />;

  const vai = p => { setPag(p); setAltro(false); setNuovoSegnale(0); };
  const admin = utente.ruolo === "admin";
  const props = {data, saldi, log, utente, mobile, prev, par, setPar, go: vai, nuovoSegnale};

  const contenuto = (
    <>
      {pag === "dashboard" && <Dashboard {...props} />}
      {pag === "movimenti" && <Movimenti {...props} />}
      {pag === "scadenze" && <Scadenze {...props} />}
      {pag === "bollette" && <Bollette {...props} />}
      {pag === "previsioni" && <Previsioni {...props} />}
      {pag === "anagrafiche" && <Anagrafiche {...props} />}
      {pag === "utenti" && admin && <Utenti utenti={utenti} log={log} utente={utente} mobile={mobile} />}
      {pag === "registro" && admin && <Registro registro={registro} mobile={mobile} />}
    </>
  );

  return (
    <div className="shell">
      <nav className="side">
        <div className="brand"><b>Finanze Famiglia</b><span>{utente.nome || utente.username}</span></div>
        {NAV_DESK.map(([k, t, i]) =>
          <button key={k} className={"navlink" + (pag === k ? " on" : "")} onClick={() => vai(k)}>
            <span className="ic">{i}</span>{t}</button>)}
        {admin && <>
          <div className="navsep">Amministrazione</div>
          {NAV_ADMIN.map(([k, t, i]) =>
            <button key={k} className={"navlink" + (pag === k ? " on" : "")} onClick={() => vai(k)}>
              <span className="ic">{i}</span>{t}</button>)}
        </>}
        <div className="side-foot">
          <button className="navlink" onClick={esci}><span className="ic">⤶</span>Esci</button></div>
      </nav>

      <div className="appbar">
        <div>
          <h1>{TITOLI[pag]}</h1>
          <div className="who">{utente.nome || utente.username}</div>
        </div>
        {pag === "dashboard" && <button className="act" onClick={esci}>Esci</button>}
      </div>

      <main className="main">{contenuto}</main>

      {mobile && AGGIUNGIBILE[pag] &&
        <button className="fab" onClick={() => setNuovoSegnale(n => n + 1)} aria-label="Aggiungi">+</button>}

      <nav className="tabbar">
        {TAB.map(([k, t, i]) => (
          <button key={k} className={(k === "altro" ? (["previsioni", "anagrafiche", "utenti", "registro"].includes(pag) ? "on" : "") : (pag === k ? "on" : ""))}
            onClick={() => k === "altro" ? setAltro(true) : vai(k)}>
            <span className="ic">{i}</span>{t}</button>))}
      </nav>

      {altro && <Sheet title="Altro" onClose={() => setAltro(false)}>
        <div className="list">
          <Riga titolo="Previsione" sotto="Come si muove la giacenza nei prossimi mesi" onClick={() => vai("previsioni")} />
          <Riga titolo="Anagrafiche" sotto="Conti e carte, membri, categorie" onClick={() => vai("anagrafiche")} />
          {admin && <Riga titolo="Utenti" sotto="Chi può entrare nell'app" onClick={() => vai("utenti")} />}
          {admin && <Riga titolo="Registro attività" sotto="Chi ha fatto cosa" onClick={() => vai("registro")} />}
          <Riga titolo="Esci" sotto={"Sei entrato come " + utente.username} onClick={esci} />
        </div>
      </Sheet>}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
